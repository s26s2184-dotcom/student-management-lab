services:
  db:
    image: mysql:8.0
    container_name: sml_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lab_root_pw_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management_lab}
      MYSQL_USER: ${MYSQL_USER:-labapp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab_app_pw_change_me}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - lab_internal
    # Not published to the host: MySQL is reachable only from the app
    # container, over the private "lab_internal" network.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-lab_root_pw_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sml_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-student_management_lab}
      DB_USER: ${MYSQL_USER:-labapp_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-lab_app_pw_change_me}
      APP_MODE: ${APP_MODE:-vulnerable}
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./secure_uploads:/var/www/html/secure_uploads
    ports:
      # Bound to localhost only — never expose this lab beyond 127.0.0.1
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    networks:
      - lab_internal

networks:
  lab_internal:
    driver: bridge
    internal: false

volumes:
  db_data:
