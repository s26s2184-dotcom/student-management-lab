x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  networks:
    - lab_internal

x-app-env: &app-env
  DB_HOST: db
  DB_NAME: ${MYSQL_DATABASE:-student_management_lab}
  DB_USER: ${MYSQL_USER:-labapp_user}
  DB_PASSWORD: ${MYSQL_PASSWORD:-lab_app_pw_change_me}

services:
  db:
    image: mysql:8.0
    container_name: sml_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lab_root_pw_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management_lab}
      MYSQL_USER: ${MYSQL_USER:-labapp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab_app_pw_change_me}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - lab_internal
    # Not published to the host: MySQL is reachable only from the app
    # containers, over the private "lab_internal" network.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-lab_root_pw_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Intentionally vulnerable build of the app (for practicing attacks)
  app_vulnerable:
    <<: *app-common
    container_name: sml_app_vulnerable
    environment:
      <<: *app-env
      APP_MODE: vulnerable
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./secure_uploads:/var/www/html/secure_uploads
    ports:
      # Bound to all interfaces so other devices on the network can reach it.
      # Only run this on a trusted, private network.
      - "${APP_BIND:-0.0.0.0}:${APP_VULN_PORT:-8080}:80"

  # Hardened build of the app (for comparing fixes)
  app_secure:
    <<: *app-common
    container_name: sml_app_secure
    environment:
      <<: *app-env
      APP_MODE: secure
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./secure_uploads:/var/www/html/secure_uploads
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_SECURE_PORT:-8081}:80"

networks:
  lab_internal:
    driver: bridge
    internal: false

volumes:
  db_data:
